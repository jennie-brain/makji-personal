<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>막지 스톡 할인율 산식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F5F5F1; --card:#FFFFFF; --card-2:#FBFBF8;
  --ink:#15171C; --ink2:#5C6168; --ink3:#8B8F96;
  --rule:#E2E2DA; --rule-2:#EDEDE6;
  --fx:#1B4FD8; --fx-soft:rgba(27,79,216,.10); --fx-mid:rgba(27,79,216,.24);
  --cp:#C07A12; --cp-soft:rgba(192,122,18,.13); --cp-mid:rgba(192,122,18,.28);
  --warn:#B23A34; --warn-soft:rgba(178,58,52,.10);
  --ok:#1F6F4A;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --W:1280px; --H:720px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;overflow:hidden}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper)}
#deck{width:var(--W);height:var(--H);position:relative;transform-origin:center center;
      background:var(--card);box-shadow:0 1px 2px rgba(21,23,28,.06),0 18px 50px -24px rgba(21,23,28,.22)}

/* ---------- slide ---------- */
.slide{position:absolute;inset:0;padding:52px 64px 56px;display:none;flex-direction:column}
.slide.is-active{display:flex}
.slide.is-cover{padding:0}

/* rails */
.rail-t{position:absolute;top:0;left:0;right:0;height:44px;padding:0 64px;
        display:flex;align-items:center;justify-content:space-between;
        border-bottom:1px solid var(--rule-2);font-family:var(--mono);font-size:10px;
        letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);z-index:3}
.rail-t b{color:var(--ink);font-weight:600;letter-spacing:.16em}
.rail-b{position:absolute;bottom:0;left:0;right:0;height:40px;padding:0 64px;
        display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule-2);z-index:3}
#ticks{display:flex;gap:3px;flex:1}
#ticks button{flex:1;height:22px;border:0;background:none;padding:0;cursor:pointer;
              display:flex;align-items:center}
#ticks button i{display:block;width:100%;height:2px;background:var(--rule);transition:background .2s,height .2s}
#ticks button[aria-current="true"] i{background:var(--fx);height:4px}
#ticks button:hover i{background:var(--ink3)}
#ticks button:focus-visible{outline:2px solid var(--fx);outline-offset:2px}
#counter{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.06em}
#counter b{color:var(--ink);font-weight:600}
.navbtn{border:1px solid var(--rule);background:var(--card);color:var(--ink2);
        width:26px;height:26px;border-radius:2px;cursor:pointer;font-size:13px;line-height:1;
        display:grid;place-items:center;transition:border-color .15s,color .15s}
.navbtn:hover{border-color:var(--ink3);color:var(--ink)}
.navbtn:focus-visible{outline:2px solid var(--fx);outline-offset:2px}

.body{flex:1;margin-top:44px;padding-top:28px;display:flex;flex-direction:column;min-height:0}

/* type */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
         color:var(--fx);font-weight:600;margin:0 0 10px}
h1{font-size:52px;line-height:1.08;letter-spacing:-.035em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:31px;line-height:1.18;letter-spacing:-.028em;font-weight:700;margin:0 0 6px;text-wrap:balance}
.sub{font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0;max-width:68ch;font-weight:300}
.lede{font-size:16px;line-height:1.6;color:var(--ink2);font-weight:300;max-width:64ch;margin:0}
.note{font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.65;letter-spacing:.01em}
strong{font-weight:600}
mark{background:none;color:var(--fx);font-weight:600}
mark.c{color:var(--cp)}
mark.w{color:var(--warn)}

/* cover */
.cover{height:100%;display:grid;grid-template-columns:1fr 400px}
.cover-l{padding:64px;display:flex;flex-direction:column;justify-content:space-between}
.cover-r{background:var(--card-2);border-left:1px solid var(--rule-2);padding:64px 44px;
         display:flex;flex-direction:column;justify-content:center;gap:0}
.cover-fig{padding:18px 0;border-bottom:1px solid var(--rule-2)}
.cover-fig:last-child{border-bottom:0}
.cover-fig .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.cover-fig .v{font-family:var(--mono);font-weight:600;font-size:34px;letter-spacing:-.03em;
              margin-top:4px;line-height:1}
.cover-fig .n{font-size:11.5px;color:var(--ink2);margin-top:5px;font-weight:300}
.meta-strip{display:flex;gap:0;border-top:1px solid var(--rule)}
.meta-strip div{padding:14px 20px 0 0;margin-right:20px;border-right:1px solid var(--rule-2)}
.meta-strip div:last-child{border-right:0}
.meta-strip .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.meta-strip .v{font-size:12.5px;font-weight:500}

/* layout helpers */
.cols{display:grid;gap:26px;flex:1;min-height:0}
.c-2{grid-template-columns:1fr 1fr}
.c-3{grid-template-columns:repeat(3,1fr)}
.c-5-7{grid-template-columns:5fr 7fr}
.c-4-8{grid-template-columns:4fr 8fr}
.c-7-5{grid-template-columns:7fr 5fr}
.stack{display:flex;flex-direction:column;gap:14px;min-height:0}

/* panel: used sparingly, not on everything */
.panel{background:var(--card-2);border:1px solid var(--rule-2);padding:20px 22px}
.panel.q{background:var(--fx-soft);border-color:transparent}
.panel.w{background:var(--warn-soft);border-color:transparent}
.panel h3{margin:0 0 8px;font-size:13.5px;font-weight:600;letter-spacing:-.01em}

/* numbered principle list (real sequence: 3 goals) */
.goals{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.goals li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:14px;
          padding:16px 0;border-bottom:1px solid var(--rule-2)}
.goals .n{font-family:var(--mono);font-size:11px;color:var(--fx);font-weight:600;padding-top:3px}
.goals .t{font-size:15px;font-weight:600;letter-spacing:-.015em}
.goals .d{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55;font-weight:300}

/* formula */
.formula{border:1px solid var(--rule);background:var(--card-2);padding:26px 28px;
         display:flex;flex-direction:column;gap:16px}
.frow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.flabel{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
        color:var(--ink3);width:74px;flex:none;padding-top:2px}
.fexpr{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.fexpr.big{font-size:21px;font-weight:600}
.fexpr .fx{color:var(--fx)}
.fexpr .cp{color:var(--cp)}
.fexpr .w{color:var(--warn)}
.fdiv{height:1px;background:var(--rule-2)}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);
      border-bottom:1px solid var(--rule)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{padding:15px 18px 15px 0;border-right:1px solid var(--rule-2)}
.kpi:last-child{border-right:0}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:5px;line-height:1}
.kpi .n{font-size:11px;color:var(--ink2);margin-top:5px;font-weight:300;line-height:1.45}
.kpi .v.fx{color:var(--fx)} .kpi .v.cp{color:var(--cp)} .kpi .v.w{color:var(--warn)} .kpi .v.ok{color:var(--ok)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
   color:var(--ink3);font-weight:500;text-align:right;padding:0 0 8px;border-bottom:1px solid var(--rule)}
th:first-child{text-align:left}
td{padding:8px 0;border-bottom:1px solid var(--rule-2);text-align:right;
   font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
td:first-child{text-align:left;font-family:var(--sans);font-size:12px}
tr:last-child td{border-bottom:0}
.tw{width:100%;overflow-x:auto}

/* evidence rows */
.ev{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.ev li{list-style:none;display:grid;grid-template-columns:26px 1fr auto;gap:16px;align-items:start;
       padding:13px 0;border-bottom:1px solid var(--rule-2)}
.ev .n{font-family:var(--mono);font-size:11px;color:var(--fx);font-weight:600;padding-top:2px}
.ev .t{font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.ev .d{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.5;font-weight:300}
.ev .val{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.025em;
         text-align:right;white-space:nowrap;padding-top:1px}
.ev .val small{display:block;font-size:9.5px;font-weight:400;color:var(--ink3);
               letter-spacing:.08em;margin-top:3px;text-transform:uppercase}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
         background:var(--fx);color:#fff;padding:16px 22px}
.verdict .tag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
              border:1px solid rgba(255,255,255,.45);padding:5px 9px}
.verdict .t{font-size:14px;font-weight:600;letter-spacing:-.01em}
.verdict .d{font-size:11.5px;opacity:.82;margin-top:3px;font-weight:300}
.verdict.open{background:var(--card-2);color:var(--ink);border:1px solid var(--rule)}
.verdict.open .tag{border-color:var(--rule);color:var(--ink3)}
.verdict.open .d{color:var(--ink2);opacity:1}

/* option cards */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{border:1px solid var(--rule);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.opt.pick{border-color:var(--fx);border-width:1.5px;background:var(--fx-soft)}
.opt .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.opt .h b{font-size:15px;letter-spacing:-.015em}
.opt .h span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.opt.pick .h span{color:var(--fx)}
.opt .pros{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);line-height:1.5;font-weight:300}
.opt .pros div{display:grid;grid-template-columns:14px 1fr;gap:6px}
.opt .pros i{font-style:normal;font-family:var(--mono);font-size:11px}
.opt .pros .y i{color:var(--ok)} .opt .pros .n i{color:var(--warn)}

/* legend */
.legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--ink2);font-weight:400}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:1px;display:block}

/* chart */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;
     font-family:var(--mono);font-size:10.5px;line-height:1.55;white-space:nowrap;opacity:0;
     transition:opacity .12s;z-index:5;transform:translate(-50%,-115%)}
#tip b{font-weight:600}
#tip .fx{color:#9DB8FF} #tip .cp{color:#F0C078}

/* timeline (ops rule) */
.tl{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.tl .d{border:1px solid var(--rule);padding:10px 8px;min-height:96px;display:flex;
       flex-direction:column;gap:6px;background:var(--card)}
.tl .d.carry{background:var(--cp-soft);border-color:transparent}
.tl .wd{font-family:var(--mono);font-size:11px;font-weight:600}
.tl .src{font-size:10px;color:var(--ink2);line-height:1.4;font-weight:300}
.tl .badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;
           padding:2px 5px;align-self:flex-start;margin-top:auto}
.tl .badge.new{background:var(--fx);color:#fff}
.tl .badge.old{background:var(--cp);color:#fff}

/* next steps */
.steps{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.steps li{list-style:none;display:grid;grid-template-columns:20px 1fr;gap:12px;padding:11px 0;
          border-bottom:1px solid var(--rule-2);font-size:12.5px;color:var(--ink2);font-weight:300;line-height:1.5}
.steps i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3);padding-top:3px}
.steps b{color:var(--ink);font-weight:600}

/* motion — base state is the resting state; animation plays from an offset */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide.is-active [data-a]{animation:rise .32s cubic-bezier(.22,.7,.3,1) backwards}
.slide.is-active [data-a="1"]{animation-delay:.02s}
.slide.is-active [data-a="2"]{animation-delay:.06s}
.slide.is-active [data-a="3"]{animation-delay:.10s}
.slide.is-active [data-a="4"]{animation-delay:.14s}
.slide.is-active [data-a="5"]{animation-delay:.18s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.slide.is-active .growx{transform-origin:left center;animation:grow .62s cubic-bezier(.22,.7,.3,1) backwards;animation-delay:.2s}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .slide.is-active [data-a],.slide.is-active .growx{animation:none}
  *{transition-duration:.01ms!important}
}
</style>

<div id="stage">
  <div id="deck" role="region" aria-label="막지 스톡 할인율 산식 슬라이드">
    <div id="tip" aria-hidden="true"></div>
  </div>
</div>

  bars.forEach(function(b){ if(b.n>max) max=b.n; });
  var bw=pw/n, s='';
  s+= line(L,Tp+ph,W-R,Tp+ph,RULE,1);
  bars.forEach(function(b,i){
    var h=ph*b.n/max, x=L+bw*i+3, y=Tp+ph-h;
    s+= rect(x,y,bw-6,h,FXC,3);
    if(b.n) s+= txt(x+(bw-6)/2,y-6,String(b.n),{size:10.5,fill:INK,w:600,anchor:'middle'});
    s+= txt(x+(bw-6)/2,Tp+ph+15,b.label,{size:9,fill:INK3,anchor:'middle'});
    s+= txt(x+(bw-6)/2,Tp+ph+27,N(b.pct,0)+'%',{size:8.5,fill:INK3,anchor:'middle'});

  s+= txt(L-6,Tp+10,'일수',{size:9,fill:INK3,anchor:'end'});
  s+= txt(W-R,H-4,'총할인 구간 (%p)',{size:9,fill:INK3,anchor:'end'});
  return svg(W,H,s);
}

/* ---------- chart 5: weekday ---------- */
function chartWeekday(){
  var W=560,H=214, L=30,B=44,Tp=14,R=8;
  var w=D.weekday, n=w.length, pw=W-L-R, ph=H-Tp-B;
  var avg=D.search.mean, max=0;
  w.forEach(function(d){ if(d.idx>max) max=d.idx; });
  max=max*1.1;
  var bw=pw/n, s='';
  s+= line(L,Tp+ph,W-R,Tp+ph,RULE,1);
  s+= line(L,Tp+ph-ph*avg/max,W-R,Tp+ph-ph*avg/max,INK3,1,'3 3');
  s+= txt(W-R,Tp+ph-ph*avg/max-5,'전체 평균 '+N(avg)+'',{size:9,fill:INK3,anchor:'end'});
  w.forEach(function(d,i){
    var h=ph*d.idx/max, x=L+bw*i+7, y=Tp+ph-h, wknd=(d.wd==='토'||d.wd==='일');
    s+= rect(x,y,bw-14,h,wknd?CPC:'#C6CBD6',3);
    s+= txt(x+(bw-14)/2,y-6,N(d.idx),{size:10,fill:wknd?CPC:INK2,w:600,anchor:'middle'});
    s+= txt(x+(bw-14)/2,Tp+ph+16,d.wd,{size:11.5,fill:wknd?CPC:INK,w:600,anchor:'middle',mono:false});

/* ---------- chart 6: frozen weekends (slope triplets) ---------- */
function chartFrozen(){
  var fz=D.frozen, n=fz.length, W=1000,H=196, L=8,R=8,Tp=18,B=40;
  var pw=(W-L-R)/n, ph=H-Tp-B, max=34;
  var s='', Y=function(v){return Tp+ph-ph*v/max};
  for(var g=0;g<=30;g+=10){ s+= line(L,Y(g),W-R,Y(g),'#F0F0EA',1);
    s+= txt(L,Y(g)-4,g+'%p',{size:8.5,fill:INK3}); }
  fz.forEach(function(f,i){
    var x0=L+pw*i+pw*0.22, step=pw*0.56/2, p='', j;
    for(j=0;j<3;j++) p+=(j?' L':'M')+(x0+step*j)+' '+Y(f.totals[j]);
    s+= '<path d="'+p+'" fill="none" stroke="'+FXC+'" stroke-width="2" stroke-linejoin="round"/>';
    for(j=0;j<3;j++) s+= '<circle cx="'+(x0+step*j)+'" cy="'+Y(f.totals[j])+'" r="3.6" fill="'+FXC+'" stroke="#fff" stroke-width="1.6"/>';
    s+= txt(x0+step,Y(Math.max.apply(null,f.totals))-10,'±'+N(f.spread),{size:9,fill:INK2,anchor:'middle',w:600});
    s+= txt(x0+step,H-22,f.date.slice(5),{size:8.5,fill:INK3,anchor:'middle'});
    if(i<n-1) s+= line(L+pw*(i+1),Tp,L+pw*(i+1),Tp+ph,'#F4F4EE',1);
  });
  s+= txt(L,H-6,'각 구간 = 토 · 일 · 월 3일 (환율 고정, 쿠폰만 변동) · 숫자는 3일간 총할인 변동폭',{size:9,fill:INK3});
  return svg(W,H,s);
}

     '<li><i>→</i><span>환율 데이터 소스 확정 — 매매기준율 / 서울외국환중개 종가 / ECOS</span></li>'+
     '<li><i>→</i><span>10종 전체 키워드로 쿠폰 분포 재검증</span></li>'+
     '<li><i>→</i><span>확정 산식을 PRD에 반영</span></li>'+
    '</ul></div>'+
  '</div>'+
 '</div>'});

/* ================= render & nav ================= */
var deck=document.getElementById('deck'), tip=document.getElementById('tip'), cur=0;
var frag='';
slides.forEach(function(s,i){
  frag+='<section class="slide'+(s.cover?' is-cover':'')+'" id="sl'+i+'" aria-hidden="true">'+
    (s.cover?'':'<div class="rail-t"><b>막지 스톡 · 할인율 산식</b><span>'+s.sec+'</span></div><div class="body">')+
    s.html+(s.cover?'':'</div>')+'</section>';
});
deck.insertAdjacentHTML('afterbegin',frag);

var rail=document.createElement('div');
rail.className='rail-b';
rail.innerHTML='<button class="navbtn" id="prev" aria-label="이전 슬라이드">‹</button>'+
  '<button class="navbtn" id="next" aria-label="다음 슬라이드">›</button>'+
  '<div id="ticks"></div><div id="counter"><b>01</b> / '+String(slides.length).padStart(2,'0')+'</div>';
deck.appendChild(rail);

var ticks=document.getElementById('ticks');
slides.forEach(function(s,i){
  var b=document.createElement('button');
  b.innerHTML='<i></i>'; b.title=(i+1)+'. '+s.sec;
  b.setAttribute('aria-label',(i+1)+'. '+s.sec);
  b.onclick=function(){go(i)};
  ticks.appendChild(b);
});
var tickEls=ticks.querySelectorAll('button'),
    slideEls=deck.querySelectorAll('.slide'),
    counter=document.getElementById('counter');

function go(i){
  if(i<0||i>=slides.length) return;
  cur=i; tip.style.opacity=0;
  slideEls.forEach(function(el,j){
    var on=j===i;
    el.classList.toggle('is-active',on);
    el.setAttribute('aria-hidden',on?'false':'true');
  });
  tickEls.forEach(function(el,j){ el.setAttribute('aria-current',j===i?'true':'false') });
  counter.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+String(slides.length).padStart(2,'0');
  if(slides[i].sec==='실데이터 결과') bindTS();
}
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); go(cur+1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(slides.length-1); }
});

/* timeseries hover */
function bindTS(){
  var cap=document.getElementById('ts-cap'), hov=document.getElementById('ts-hover');
  if(!cap||cap.dataset.bound) return;
  cap.dataset.bound='1';
  var lineEl=hov.querySelector('line'), dots=hov.querySelectorAll('circle');
  var svgEl=cap.ownerSVGElement, wrap=svgEl.parentNode;
  cap.addEventListener('mousemove',function(e){
    var r=svgEl.getBoundingClientRect(), sc=TS.W/r.width;
    var vx=(e.clientX-r.left)*sc;
    var i=Math.round((vx-TS.L)/TS.pw*(TS.n-1));
    i=Math.max(0,Math.min(TS.n-1,i));
    var x=TS.X(i);
    hov.setAttribute('opacity','1');
    lineEl.setAttribute('x1',x); lineEl.setAttribute('x2',x);
    dots[0].setAttribute('cx',x); dots[0].setAttribute('cy',TS.Y(S.tot[i]));
    dots[1].setAttribute('cx',x); dots[1].setAttribute('cy',TS.Y(S.fx[i]));
    tip.innerHTML='<b>'+S.date[i]+' ('+S.wd[i]+')</b>'+(S.fresh[i]?'':' <span style="opacity:.6">이월</span>')+
      '<br>환율 <span class="fx">'+N(S.drop[i],3)+'%</span> → <span class="fx">'+N(S.fx[i])+'%p</span>'+
      '<br>검색 <span class="cp">'+N(S.idx[i])+'</span> → <span class="cp">'+N(S.cp[i])+'%p</span>'+
      '<br>총할인 <b>'+N(S.tot[i])+'%p</b> · '+Math.round(4500*(1-S.tot[i]/100)).toLocaleString()+'원';
    var wr=wrap.getBoundingClientRect();
    tip.style.left=(x/sc)+'px';
    tip.style.top=(TS.Y(S.tot[i])/sc)+'px';
    tip.style.opacity=1;
  });
  cap.addEventListener('mouseleave',function(){ hov.setAttribute('opacity','0'); tip.style.opacity=0; });
}

/* fit stage */
function fit(){
  var s=Math.min(innerWidth/1280, innerHeight/720);
  deck.style.transform='scale('+s+')';
}
addEventListener('resize',fit); fit(); go(0);
})();
</script>
