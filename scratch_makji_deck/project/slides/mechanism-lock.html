<p style="font-size:26px; color:#4A5568">오전장에만, 하루 1회, 빵 1개 — 고민을 "어떤 빵을 살까" 하나로 줄이기 위해서입니다</p>
<div style="display:flex; gap:32px">

<p style="font-size:24px; color:#4A5568">차액만큼 할인코드 발급 → 잠근 가격에 구매</p>

<div style="flex:1; background:#FFFFFF; border:1px solid #E3E6E4; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px">

<p style="font-size:24px; color:#4A5568">코드 없이, 더 싼 오후가가 자동 적용</p>
